<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Standard opt-out: tells compliant browsers this page is light-only,
       and "only" additionally asks the UA not to substitute a forced scheme -->
  <meta name="color-scheme" content="only light">
  <title>Gray Background</title>
  <style>
    html {
      color-scheme: only light;
    }
    html, body {
      background-color: gray;
      height: 100%;
      margin: 0;
    }
    /* Explicit author-specified text color, since some heuristics only
       repaint colors left at browser-default rather than author-set ones */
    body {
      color: #1a1a1a;
    }
  </style>
</head>
<body>
  <p id="mode-status" style="font-family: sans-serif;"></p>
  <script>
    function updateModeText() {
      const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.getElementById('mode-status').textContent = isDark ? 'Dark mode On' : 'Dark mode Off';
    }
    updateModeText();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateModeText);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light">
  <title>Gray Background</title>
  <style>
    html {
      color-scheme: light;
    }
    html, body {
      background-color: gray;
      height: 100%;
      margin: 0;
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: gray !important;
      }
    }
  </style>
</head>
<body>
  <p id="mode-status" style="font-family: sans-serif;"></p>
  <script>
    function updateModeText() {
      const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.getElementById('mode-status').textContent = isDark ? 'Dark mode On' : 'Dark mode Off';
    }
    updateModeText();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateModeText);
  </script>
</body>
</html>

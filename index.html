<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Finance Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root {
  --bg: #0D0F0E;
  --surface: #141714;
  --surface2: #1C201C;
  --surface3: #232823;
  --accent: #F59E0B;
  --accent-dim: #D97706;
  --accent-pale: #1C1000;
  --text: #E8EDE9;
  --text-muted: #7A8C7D;
  --text-faint: #3D4D3F;
  --border: #1F261F;
  --border-mid: #2A352A;
  --red: #F87171;
  --red-pale: #2A0A0A;
  --amber: #FCD34D;
  --amber-pale: #271A00;
  --blue: #60A5FA;
  --blue-pale: #0A1628;
  --purple: #C084FC;
  --purple-pale: #1A0A2A;
  --radius: 12px;
  --radius-sm: 7px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 2rem 1rem 4rem;
}

header {
  max-width: 900px;
  margin: 0 auto 2.5rem;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding-bottom: 1.25rem;
  border-bottom: 1px solid var(--border-mid);
}

.logo { display: flex; flex-direction: column; gap: 4px; }

.logo h1 {
  font-family: 'Syne', sans-serif;
  font-size: 1.6rem;
  font-weight: 600;
  color: #4ADE80;
  letter-spacing: -0.02em;
  line-height: 1;
}

.logo span {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-faint);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

#last-updated {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-faint);
  text-align: right;
  line-height: 1.7;
}

.container { max-width: 900px; margin: 0 auto; }

.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
  gap: 10px;
  margin-bottom: 2rem;
}

.metric {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem 1.25rem;
  position: relative;
  overflow: hidden;
  transition: border-color 0.2s;
}

.metric:hover { border-color: var(--border-mid); }

.metric-label {
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-faint);
  margin-bottom: 8px;
}

.metric-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.6rem;
  font-weight: 500;
  line-height: 1;
}

.metric.green .metric-value { color: var(--accent); }
.metric.amber .metric-value { color: var(--amber); }
.metric.blue .metric-value { color: var(--blue); }
.metric.red .metric-value { color: var(--red); }
.metric.purple .metric-value { color: var(--purple); }

.metric-sub {
  font-size: 11px;
  color: var(--text-faint);
  margin-top: 4px;
  font-family: 'JetBrains Mono', monospace;
}

section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 1.25rem;
  overflow: hidden;
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.9rem 1.25rem;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
  gap: 12px;
}

.section-header:hover { background: var(--surface2); }

.section-title {
  font-family: 'Syne', sans-serif;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-title svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0; }

.header-actions { display: flex; gap: 6px; }

.pill-btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  padding: 4px 12px;
  border-radius: 20px;
  border: 1px solid var(--border-mid);
  background: var(--surface2);
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}

.pill-btn:hover { background: var(--surface3); color: var(--text); border-color: var(--text-faint); }
.pill-btn.danger:hover { color: var(--red); border-color: var(--red); background: var(--red-pale); }

.add-form {
  padding: 1.1rem 1.25rem;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  display: none;
}

.add-form.open { display: block; }

.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }

label {
  display: block;
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--text-faint);
  margin-bottom: 5px;
}

input:not([type="checkbox"]), select {
  width: 100%;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  padding: 8px 10px;
  border: 1px solid var(--border-mid);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text);
  outline: none;
  transition: border-color 0.15s;
  -webkit-appearance: none;
}

input[type="checkbox"] {
  appearance: none;
  -webkit-appearance: none;
  width: 15px !important;
  height: 15px !important;
  min-width: 15px;
  cursor: pointer;
  border: 1.5px solid var(--border-mid);
  border-radius: 4px;
  background: var(--surface2);
  transition: background 0.15s, border-color 0.15s;
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
input[type="checkbox"]:hover { border-color: #4ADE80; }
input[type="checkbox"]:checked {
  background: #4ADE80;
  border-color: #4ADE80;
}
input[type="checkbox"]:checked::after {
  content: '';
  display: block;
  width: 4px;
  height: 7px;
  border: 2px solid #0a0a0a;
  border-top: none;
  border-left: none;
  transform: rotate(45deg) translate(-1px, -1px);
}

input:not([type="checkbox"]):focus, select:focus { border-color: var(--accent); }
input:not([type="checkbox"])::placeholder { color: var(--text-faint); }

select option { background: var(--surface); }

.form-actions { margin-top: 12px; display: flex; gap: 8px; }

.btn {
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 500;
  padding: 8px 20px;
  border-radius: var(--radius-sm);
  border: none;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
}

.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--accent); color: #000; }
.btn-primary:hover { opacity: 0.85; }
.btn-ghost { background: var(--surface3); color: var(--text-muted); border: 1px solid var(--border-mid); }
.btn-ghost:hover { color: var(--text); }

table { width: 100%; border-collapse: collapse; }

th {
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-faint);
  padding: 8px 1.25rem;
  text-align: left;
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
}

td {
  font-size: 13px;
  padding: 10px 1.25rem;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
  color: var(--text);
}

tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--surface2); }

.mono { font-family: 'JetBrains Mono', monospace; }

.badge {
  display: inline-block;
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 500;
  padding: 3px 9px;
  border-radius: 20px;
  letter-spacing: 0.02em;
}

.badge-unpaid { background: var(--amber-pale); color: var(--amber); border: 1px solid #3D2800; }
.badge-check { background: var(--blue-pale); color: var(--blue); border: 1px solid #0F2040; }
.badge-paid { background: var(--accent-pale); color: var(--accent); border: 1px solid #3D2800; }
.badge-gift { background: var(--purple-pale); color: var(--purple); border: 1px solid #2A1040; }
.badge-expense { background: var(--red-pale); color: var(--red); border: 1px solid #3D0A0A; }
.badge-income { background: var(--accent-pale); color: var(--accent); border: 1px solid #3D2800; }

.row-actions { display: flex; gap: 5px; justify-content: flex-end; }

.act-btn {
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  padding: 3px 9px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-mid);
  background: transparent;
  cursor: pointer;
  color: var(--text-muted);
  transition: all 0.12s;
}

.act-btn:hover { background: var(--surface3); color: var(--text); }
.act-btn.danger { color: var(--red); border-color: #3D0A0A; }
.act-btn.danger:hover { background: var(--red-pale); }
.act-btn.success { color: #4ADE80; border-color: #0A3D1A; }
.act-btn.success:hover { background: #052E16; }
.act-btn.edit { color: var(--blue); border-color: #0F2040; }
.act-btn.edit:hover { background: var(--blue-pale); }
.act-btn.save { color: var(--accent); border-color: #3D2800; }
.act-btn.save:hover { background: var(--accent-pale); }

/* Inline edit row */
.edit-row td { padding: 8px 1.25rem; background: var(--surface2); }
.edit-row input, .edit-row select {
  font-size: 12px;
  padding: 5px 8px;
  width: 100%;
  min-width: 60px;
}
.edit-row .row-actions { margin-top: 0; }

.empty-state {
  padding: 2rem;
  text-align: center;
  color: var(--text-faint);
  font-size: 13px;
  font-style: italic;
}

.table-wrap { overflow-x: auto; }

.history-entry {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 9px 1.25rem;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}

.history-entry:last-child { border-bottom: none; }
.history-entry:hover { background: var(--surface2); }

.history-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
.dot-add { background: var(--accent); }
.dot-paid { background: var(--blue); }
.dot-delete { background: var(--red); }
.dot-other { background: var(--purple); }
.dot-client { background: var(--amber); }

.history-action { color: var(--text-muted); flex: 1; line-height: 1.5; }
.history-time { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-faint); white-space: nowrap; margin-top: 3px; }

#history-body { max-height: 340px; overflow-y: auto; }

.divider {
  height: 1px;
  background: var(--border);
  margin: 0.5rem 0;
}

.toast {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  background: var(--surface3);
  border: 1px solid var(--border-mid);
  color: var(--accent);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  padding: 10px 18px;
  border-radius: var(--radius);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.2s, transform 0.2s;
  pointer-events: none;
}

.toast.show { opacity: 1; transform: translateY(0); }

.amount-pos { color: var(--accent); }
.amount-neg { color: var(--red); }

@media (max-width: 600px) {
  header { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
  th:nth-child(4), td:nth-child(4) { display: none; }
}

/* Client job dropdown */
.client-jobs-toggle { background:none; border:none; color:var(--text-muted); font-size:11px; cursor:pointer; padding:2px 8px; border-radius:4px; font-family:'JetBrains Mono',monospace; white-space:nowrap; }
.client-jobs-toggle:hover { color:var(--text); background:var(--surface3); }
.client-jobs-panel { display:none; background:var(--surface2); border-top:1px solid var(--border); }
.client-jobs-panel.open { display:block; }
.client-jobs-panel table { width:100%; }
.client-jobs-panel th { font-size:10px; padding:6px 1rem; color:var(--text-muted); background:transparent; }
.client-jobs-panel td { padding:6px 1rem; font-size:12px; }
.client-jobs-panel tr:not(:last-child) td { border-bottom:1px solid var(--border); }
.auth-area { display:flex; align-items:center; gap:10px; }
.auth-user { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-muted); }
.auth-user img { width:28px; height:28px; border-radius:50%; border:1px solid var(--border-mid); }
.btn-signin { display:flex; align-items:center; gap:8px; padding:7px 14px; background:var(--surface2); border:1px solid var(--border-mid); border-radius:8px; color:var(--text); font-size:13px; cursor:pointer; transition:background .15s; font-family:'Inter',sans-serif; }
.btn-signin:hover { background:var(--surface3); }
.btn-signout { background:none; border:none; color:var(--text-muted); font-size:11px; cursor:pointer; padding:2px 6px; border-radius:4px; font-family:'Inter',sans-serif; }
.btn-signout:hover { color:var(--red); }
#auth-loading { font-size:12px; color:var(--text-muted); font-family:'JetBrains Mono',monospace; }
.sync-dot { width:6px; height:6px; border-radius:50%; background:#4ADE80; display:inline-block; margin-right:5px; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <h1>Finance Manager</h1>
  </div>
  <div class="auth-area" id="auth-area">
    <span id="auth-loading">connecting…</span>
  </div>
</header>

<div class="container">

  <div class="summary-grid" id="summary"></div>

  <!-- Clients -->
  <section>
    <div class="section-header" onclick="toggleForm('client-form', this)">
      <div class="section-title">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        Clients
      </div>
      <div class="header-actions">
        <button class="pill-btn" style="color:#4ADE80;border-color:#0A3D1A;background:#052E16" tabindex="-1">+ Add client</button>
      </div>
    </div>
    <div class="add-form" id="client-form">
      <div class="form-grid">
        <div><label>Name / nickname</label><input type="text" id="cl-name" placeholder="e.g. Mr. Johnson" /></div>
        <div><label>Note (optional)</label><input type="text" id="cl-note" placeholder="e.g. Oak St." /></div>
        <div><label>Rate per job ($)</label><input type="number" id="cl-rate" placeholder="0.00" min="0" step="0.01" /></div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="addClient()">Add client</button>
        <button class="btn btn-ghost" onclick="toggleForm('client-form')">Cancel</button>
      </div>
    </div>
    <div id="clients-wrap"><div class="empty-state">No clients yet.</div></div>
    <div id="bulk-bar" style="display:none;padding:8px 1.25rem;background:var(--surface2);border-top:1px solid var(--border);align-items:center;gap:10px">
      <span id="bulk-count" style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-muted)"></span>
      <button class="act-btn success" onclick="bulkMarkPaid()" style="font-size:12px;padding:4px 14px">mark selected as paid</button>
      <button class="act-btn danger" onclick="bulkDelete()" style="font-size:12px;padding:4px 14px">delete selected</button>
    </div>
  </section>

  <!-- Add Job -->
  <section>
    <div class="section-header" onclick="toggleForm('lawn-form', this)">
      <div class="section-title">
        <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>
        Jobs
      </div>
      <div class="header-actions">
        <button class="pill-btn" style="color:#4ADE80;border-color:#0A3D1A;background:#052E16" tabindex="-1">+ Add job</button>
      </div>
    </div>
    <div class="add-form" id="lawn-form">
      <div class="form-grid">
        <div><label>Client</label><select id="lj-client" onchange="prefillJobAmount()"></select></div>
        <div><label>Date</label><input type="date" id="lj-date" /></div>
        <div><label>Amount ($)</label><input type="number" id="lj-amount" min="0" step="0.01" placeholder="auto" /></div>
        <div><label>Status</label>
          <select id="lj-status">
            <option value="unpaid">Unpaid</option>
            <option value="check">Check coming</option>
            <option value="paid">Paid</option>
          </select>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="addLawnJob()">Add job</button>
        <button class="btn btn-ghost" onclick="toggleForm('lawn-form')">Cancel</button>
      </div>
    </div>
  </section>

  <!-- Income & Expenses -->
  <section>
    <div class="section-header" onclick="toggleForm('other-form', this)">
      <div class="section-title">
        <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
        Income &amp; Expenses
      </div>
      <div class="header-actions">
        <button class="pill-btn" tabindex="-1">+ Add entry</button>
      </div>
    </div>
    <div class="add-form" id="other-form">
      <div class="form-grid">
        <div><label>Description</label><input type="text" id="om-desc" placeholder="e.g. Birthday money" /></div>
        <div><label>Date</label><input type="date" id="om-date" /></div>
        <div><label>Category</label>
          <select id="om-type">
            <option value="gift">Gift / birthday</option>
            <option value="income">Other income</option>
            <option value="expense">Expense</option>
          </select>
        </div>
        <div><label>Amount ($)</label><input type="number" id="om-amount" placeholder="0.00" min="0" step="0.01" /></div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="addOtherMoney()">Add entry</button>
        <button class="btn btn-ghost" onclick="toggleForm('other-form')">Cancel</button>
      </div>
    </div>
    <div id="other-wrap"><div class="empty-state">No entries yet.</div></div>
  </section>

  <!-- History -->
  <section>
    <div class="section-header" onclick="toggleSection('history-body')">
      <div class="section-title">
        <svg viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        Full history
      </div>
      <div class="header-actions">
        <button class="pill-btn danger" tabindex="-1" onclick="event.stopPropagation(); clearHistory()">Clear</button>
      </div>
    </div>
    <div id="history-body">
      <div id="history-wrap"><div class="empty-state">No history yet.</div></div>
    </div>
  </section>

</div>

<div class="toast" id="toast"></div>

<script>
// ── Firebase ──────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyCbN_krdSpUY3fB6lXYwK7dwyo4HiXY_Ks",
  authDomain: "finance-manager-56a03.firebaseapp.com",
  projectId: "finance-manager-56a03",
  storageBucket: "finance-manager-56a03.firebasestorage.app",
  messagingSenderId: "812739334467",
  appId: "1:812739334467:web:12cf4972c373ebad09dff6"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();
let currentUser = null;

function userDoc() { return db.collection('users').doc(currentUser.uid); }

async function loadFromFirestore() {
  const snap = await userDoc().get();
  if (snap.exists) {
    const d = snap.data();
    clients    = d.clients    || [];
    lawnJobs   = d.lawnJobs   || [];
    otherMoney = d.otherMoney || [];
    historyLog = d.historyLog || [];
    balances   = d.balances   || { bank: 0, cash: 0 };
  } else {
    clients = []; lawnJobs = []; otherMoney = []; historyLog = []; balances = { bank: 0, cash: 0 };
    await saveToFirestore();
  }
  render(); renderClients(); renderHistory();
}

let saveTimer;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveToFirestore, 800);
}

async function saveToFirestore() {
  if (!currentUser) return;
  await userDoc().set({ clients, lawnJobs, otherMoney, historyLog, balances });
}

auth.onAuthStateChanged(user => {
  const area = document.getElementById('auth-area');
  if (user) {
    currentUser = user;
    area.innerHTML = `
      <div class="auth-user">
        <span class="sync-dot"></span>
        <img src="${user.photoURL || ''}" onerror="this.style.display='none'" />
        <span>${user.displayName || user.email}</span>
        <button class="btn-signout" onclick="loadFromFirestore()" title="Refresh data">↻ refresh</button>
        <button class="btn-signout" onclick="signOut()">sign out</button>
      </div>`;
    loadFromFirestore();
  } else {
    currentUser = null;
    area.innerHTML = `
      <button class="btn-signin" onclick="signIn()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
        Sign in with Google
      </button>`;
  }
});

function signIn() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider);
}
function signOut() {
  if (confirm('Sign out?')) auth.signOut();
}

// ── App data ──────────────────────────────────────────────
let clients    = [];
let lawnJobs   = [];
let otherMoney = [];
let historyLog = [];
let balances   = { bank: 0, cash: 0 };

function getRate(name) { const c = clients.find(c => c.name===name); return c ? c.rate : 0; }
function jobAmount(j) { return j.amount !== undefined ? j.amount : getRate(j.client); }

function fmt(d) { const [y,m,dy] = d.split('-'); return `${parseInt(m)}/${parseInt(dy)}/${y.slice(2)}`; }

function logHistory(type, message) {
  historyLog.unshift({ id:'h'+Date.now(), type, message, ts: new Date().toISOString() });
  if (historyLog.length > 300) historyLog = historyLog.slice(0, 300);
}

function statusBadge(s) {
  return { unpaid:'<span class="badge badge-unpaid">Unpaid</span>', check:'<span class="badge badge-check">Check coming</span>', paid:'<span class="badge badge-paid">Paid</span>' }[s] || '';
}

function refreshClientDropdown() {
  const sel = document.getElementById('lj-client');
  sel.innerHTML = clients.map(c => `<option value="${c.name}">${c.name}${c.note?' ('+c.note+')':''} — $${c.rate}</option>`).join('');
  prefillJobAmount();
}

function renderClients() {
  const wrap = document.getElementById('clients-wrap');
  if (!clients.length) { wrap.innerHTML = '<div class="empty-state">No clients yet.</div>'; refreshClientDropdown(); return; }

  wrap.innerHTML = clients.map(c => {
    const clientJobs = lawnJobs.filter(j => j.client === c.name && j.status !== 'paid')
      .sort((a,b) => b.date.localeCompare(a.date));
    const jobCount = clientJobs.length;
    const owed = clientJobs.reduce((s,j) => s + jobAmount(j), 0);

    const jobRows = clientJobs.map(j => `
      <tr id="jrow-${j.id}">
        <td style="width:32px"><input type="checkbox" class="job-cb" data-id="${j.id}" onclick="updateBulkBar()" /></td>
        <td class="mono">${fmt(j.date)}</td>
        <td style="color:var(--text-muted);font-size:12px">${j.client}</td>
        <td class="mono amount-pos">$${jobAmount(j)}</td>
        <td>${statusBadge(j.status)}</td>
        <td><div class="row-actions">
          <button class="act-btn edit" onclick="editJob('${j.id}')">edit</button>
          <button class="act-btn success" onclick="markPaid('${j.id}')">mark paid</button>
          <button class="act-btn danger" onclick="deleteJob('${j.id}')">delete</button>
        </div></td>
      </tr>`).join('');

    return `
      <div id="crow-${c.id}">
        <div style="display:flex;align-items:center;padding:10px 1.25rem;gap:10px;border-bottom:1px solid var(--border)">
          <div style="font-weight:500">${c.name}</div>
          ${jobCount > 0 ? `
          <button class="client-jobs-toggle" onclick="toggleClientJobs('${c.id}')">
            ${jobCount} job${jobCount>1?'s':''} · $${owed} owed ▾
          </button>` : '<span style="font-size:11px;color:var(--text-muted)">no open jobs</span>'}
          <div style="flex:1"></div>
          <div style="color:var(--text-muted);font-size:12px">${c.note||''}</div>
          <div style="font-family:\'JetBrains Mono\',monospace;font-size:12px;color:var(--text-muted)">$${c.rate}/job</div>
          <div class="row-actions" style="margin:0">
            <button class="act-btn edit" onclick="editClient('${c.id}')">edit</button>
            <button class="act-btn danger" onclick="deleteClient('${c.id}')">remove</button>
          </div>
        </div>
        ${jobCount > 0 ? `
        <div class="client-jobs-panel" id="jobs-panel-${c.id}">
          <table>
            <thead><tr>
              <th colspan="2" style="width:auto">
                <div style="display:flex;align-items:center;gap:6px">
                  <input type="checkbox" id="select-all-${c.id}" onchange="toggleClientSelectAll(this,'${c.id}')" style="cursor:pointer;width:13px;height:13px;accent-color:#4ADE80" />
                  <span style="font-size:10px;color:var(--text-muted);font-weight:500;letter-spacing:.05em;cursor:pointer" onclick="document.getElementById('select-all-${c.id}').click()">SELECT ALL</span>
                </div>
              </th>
              <th>CLIENT</th><th>AMOUNT</th><th>STATUS</th><th></th>
            </tr></thead>
            <tbody>${jobRows}</tbody>
          </table>
        </div>` : ''}
      </div>`;
  }).join('');

  refreshClientDropdown();
}

function toggleClientJobs(cid) {
  const panel = document.getElementById('jobs-panel-'+cid);
  if (panel) panel.classList.toggle('open');
}

function toggleClientSelectAll(cb, cid) {
  const panel = document.getElementById('jobs-panel-'+cid);
  if (!panel) return;
  panel.querySelectorAll('.job-cb').forEach(c => c.checked = cb.checked);

}

function editClient(id) {
  const c = clients.find(c=>c.id===id);
  const wrap = document.getElementById('crow-'+id);
  const row = wrap.querySelector('div');
  row.innerHTML = `
    <input id="ec-name-${id}" value="${c.name}" style="flex:1;font-size:13px;padding:5px 8px" />
    <input id="ec-note-${id}" value="${c.note||''}" placeholder="note" style="flex:1;font-size:13px;padding:5px 8px" />
    <span style="font-size:12px;color:var(--text-muted)">$</span>
    <input id="ec-rate-${id}" type="number" value="${c.rate}" min="0" step="0.01" style="width:70px;font-size:13px;padding:5px 8px" />
    <div class="row-actions" style="margin:0">
      <button class="act-btn save" onclick="saveClient('${id}')">save</button>

function saveClient(id) {
  const name = document.getElementById('ec-name-'+id).value.trim();
  const note = document.getElementById('ec-note-'+id).value.trim();
  const rate = parseFloat(document.getElementById('ec-rate-'+id).value);

  const old = clients.find(c=>c.id===id);
  clients = clients.map(c => c.id===id ? {...c, name, note, rate} : c);
  logHistory('client', `Edited client — ${old.name} → ${name}, $${old.rate} → $${rate}/job`);
  save(); renderClients(); render(); toast('Client updated ✓');
}

function reopenPanel(clientName) {
  const c = clients.find(c => c.name === clientName);
  if (c) { const p = document.getElementById('jobs-panel-'+c.id); if (p) p.classList.add('open'); }
}

function render() {
  renderClients();

  const omSorted = [...otherMoney].sort((a,b) => b.date.localeCompare(a.date));
  const omWrap = document.getElementById('other-wrap');
  if (!omSorted.length) {
    omWrap.innerHTML = '<div class="empty-state">No entries yet.</div>';
  } else {
    omWrap.innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>Date</th><th>Description</th><th>Amount</th><th>Category</th><th style="text-align:right">Actions</th></tr></thead>
      <tbody>${omSorted.map(e => {
        const isExp = e.type==='expense';
        const cls = e.type==='gift'?'badge-gift': isExp?'badge-expense':'badge-income';
        const lbl = e.type==='gift'?'Gift / birthday': isExp?'Expense':'Income';
        return `<tr id="orow-${e.id}">
          <td class="mono">${fmt(e.date)}</td>
          <td>${e.desc}</td>
          <td class="mono ${isExp?'amount-neg':'amount-pos'}">${isExp?'-':'+'}$${parseFloat(e.amount).toFixed(2)}</td>
          <td><span class="badge ${cls}">${lbl}</span></td>
          <td><div class="row-actions">
            <button class="act-btn edit" onclick="editOther('${e.id}')">edit</button>
            <button class="act-btn danger" onclick="deleteOther('${e.id}')">delete</button>
          </div></td>
        </tr>`;
      }).join('')}</tbody></table></div>`;
  }

  const unpaid   = lawnJobs.filter(j=>j.status==='unpaid').reduce((s,j)=>s+jobAmount(j),0);
  const check    = lawnJobs.filter(j=>j.status==='check').reduce((s,j)=>s+jobAmount(j),0);
  const paidJobs = lawnJobs.filter(j=>j.status==='paid').reduce((s,j)=>s+jobAmount(j),0);
  const income   = otherMoney.filter(e=>e.type!=='expense').reduce((s,e)=>s+parseFloat(e.amount),0);
  const expenses = otherMoney.filter(e=>e.type==='expense').reduce((s,e)=>s+parseFloat(e.amount),0);
  const netCash  = paidJobs + income - expenses;

  document.getElementById('summary').innerHTML = `
    <div class="metric green"><div class="metric-label">Net cash</div><div class="metric-value">$${netCash.toFixed(2)}</div><div class="metric-sub">paid + income − expenses</div></div>
    <div class="metric amber"><div class="metric-label">Owed to you</div><div class="metric-value">$${unpaid+check}</div><div class="metric-sub">${unpaid>0?'$'+unpaid+' unpaid':''}${unpaid>0&&check>0?' · ':''}${check>0?'$'+check+' by check':''}</div></div>
    <div class="metric blue"><div class="metric-label">Total earned</div><div class="metric-value">$${(paidJobs+income).toFixed(2)}</div><div class="metric-sub">jobs + other income</div></div>
    <div class="metric red"><div class="metric-label">Expenses</div><div class="metric-value">$${expenses.toFixed(2)}</div><div class="metric-sub">&nbsp;</div></div>
    <div class="metric purple" id="bal-bank-card" title="Click to edit" style="cursor:pointer" onclick="editBalance('bank')">
      <div class="metric-label">In bank</div>
      <div class="metric-value" id="bal-bank-val">$${parseFloat(balances.bank).toFixed(2)}</div>
      <div class="metric-sub">click to update</div>
    </div>
    <div class="metric" id="bal-cash-card" title="Click to edit" style="cursor:pointer;--mv-color:var(--amber)" onclick="editBalance('cash')">
      <div class="metric-label">Cash on hand</div>
      <div class="metric-value" id="bal-cash-val" style="color:var(--amber)">$${parseFloat(balances.cash).toFixed(2)}</div>
      <div class="metric-sub">click to update</div>
    </div>
  `;

renderHistory();
}

function renderHistory() {
  const wrap = document.getElementById('history-wrap');
  if (!historyLog.length) { wrap.innerHTML='<div class="empty-state">No history yet.</div>'; return; }
  wrap.innerHTML = historyLog.map(h => {
    const dc = {add:'dot-add',paid:'dot-paid',delete:'dot-delete',other:'dot-other',client:'dot-client'}[h.type]||'dot-add';
    const d = new Date(h.ts);
    return `<div class="history-entry" id="hrow-${h.id}">
      <div class="history-dot ${dc}"></div>
      <div class="history-action">${h.message}</div>
      <div class="history-time">${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}<br>${d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}</div>
      <div class="row-actions" style="flex-shrink:0;margin-left:8px">
        ${h.type==='paid' && (h.jobId || h.bulkJobIds) ? `<button class="act-btn" style="color:#4ADE80;border-color:#0A3D1A" onclick="undoPaid('${h.id}')">undo</button>` : ''}
        <button class="act-btn edit" onclick="editHistory('${h.id}')">edit</button>
        <button class="act-btn danger" onclick="deleteHistory('${h.id}')">delete</button>
      </div>
    </div>`;
  }).join('');
}

function editHistory(id) {
  const h = historyLog.find(h=>h.id===id);
  const row = document.getElementById('hrow-'+id);
  const dc = {add:'dot-add',paid:'dot-paid',delete:'dot-delete',other:'dot-other',client:'dot-client'}[h.type]||'dot-add';
  const d = new Date(h.ts);
  row.innerHTML = `
    <div class="history-dot ${dc}"></div>
    <div style="flex:1"><input id="hmsg-${id}" value="${h.message.replace(/"/g,'&quot;')}" style="width:100%;font-size:12px;padding:5px 8px" /></div>
    <div class="history-time">${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}<br>${d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}</div>
    <div class="row-actions" style="flex-shrink:0;margin-left:8px">
      <button class="act-btn save" onclick="saveHistory('${id}')">save</button>
      <button class="act-btn" onclick="renderHistory()">cancel</button>
    </div>`;
}

function saveHistory(id) {
  const msg = document.getElementById('hmsg-'+id).value.trim();
  if (!msg) { alert('Message cannot be empty.'); return; }
  historyLog = historyLog.map(h => h.id===id ? {...h, message: msg} : h);
  save(); renderHistory(); toast('Log entry updated ✓');
}

function deleteHistory(id) {
  if (!confirm('Delete this log entry?')) return;
  historyLog = historyLog.filter(h=>h.id!==id);
  save(); renderHistory(); toast('Log entry deleted');
}

function clearHistory() {
  if (!confirm('Clear all history?')) return;
  historyLog=[]; save(); renderHistory(); toast('History cleared');
}

function toggleForm(id) { document.getElementById(id).classList.toggle('open'); }
function toggleSection(id) { const el=document.getElementById(id); el.style.display=el.style.display==='none'?'':'none'; }

function addClient() {

  if (!name||isNaN(rate)||rate<=0) { alert('Please enter a name and rate.'); return; }

  clients.push({id:'c'+Date.now(),name,note,rate});

  document.getElementById('cl-name').value='';

  document.getElementById('cl-rate').value='';

function deleteClient(id) {

  if (!confirm(`Remove ${c.name}?`)) return;
  clients=clients.filter(c=>c.id!==id);
  logHistory('delete',`Removed client — ${c.name}`);

function toggleSelectAll(cb) {
  document.querySelectorAll('.job-cb').forEach(c => c.checked = cb.checked);

}

function updateBulkBar() {
  const checked = document.querySelectorAll('.job-cb:checked');
  const bar = document.getElementById('bulk-bar');
  const countEl = document.getElementById('bulk-count');
  const allCb = document.getElementById('select-all-jobs');
  const all = document.querySelectorAll('.job-cb');
  if (checked.length > 0) {
    bar.style.display = 'flex';
    countEl.textContent = `${checked.length} job${checked.length>1?'s':''} selected`;
  } else {
    bar.style.display = 'none';
  }
  if (allCb) allCb.checked = all.length > 0 && checked.length === all.length;
}

function bulkMarkPaid() {
  const checked = [...document.querySelectorAll('.job-cb:checked')];
  if (!checked.length) return;
  const ids = checked.map(c => c.dataset.id);
  const jobs = ids.map(id => lawnJobs.find(j => j.id===id)).filter(Boolean);

  // Group by client
  const byClient = {};
  jobs.forEach(j => {
    if (!byClient[j.client]) byClient[j.client] = [];
    byClient[j.client].push(j);
  });

  // Mark all as paid and log one entry per client
  const hid = Date.now();
  Object.entries(byClient).forEach(([client, cJobs], i) => {
    const total = cJobs.reduce((s, j) => s + getRate(j.client), 0);
    const dates = cJobs.map(j => j.date).sort();
    const dateRange = dates.length === 1
      ? fmt(dates[0])
      : `${fmt(dates[0])} – ${fmt(dates[dates.length-1])}`;
    const jobIds = cJobs.map(j => j.id);
    historyLog.unshift({
      id: 'h'+(hid+i),
      type: 'paid',
      message: `Marked ${client} paid — ${cJobs.length} job${cJobs.length>1?'s':''} (${dateRange}) — $${total}`,
      ts: new Date().toISOString(),
      bulkJobIds: jobIds,
      prevStatuses: Object.fromEntries(cJobs.map(j=>[j.id, j.status]))
    });
  });

  lawnJobs = lawnJobs.map(j => ids.includes(j.id) ? {...j, status:'paid'} : j);
  if (historyLog.length > 300) historyLog = historyLog.slice(0, 300);
  save(); render(); updateBulkBar(); toast(`${jobs.length} jobs marked as paid ✓`);
}

function bulkDelete() {
  const checked = [...document.querySelectorAll('.job-cb:checked')];
  if (!checked.length) return;
  const ids = checked.map(c => c.dataset.id);
  const jobs = ids.map(id => lawnJobs.find(j => j.id === id)).filter(Boolean);
  if (!confirm(`Delete ${jobs.length} selected job${jobs.length > 1 ? 's' : ''}?`)) return;
  jobs.forEach(j => logHistory('delete', `Deleted job — ${j.client} on ${fmt(j.date)} ($${jobAmount(j)})`));
  lawnJobs = lawnJobs.filter(j => !ids.includes(j.id));
  save(); render(); updateBulkBar(); toast(`${jobs.length} job${jobs.length > 1 ? 's' : ''} deleted`);
}

function markPaid(id) {
  const j=lawnJobs.find(j=>j.id===id);
  const prev=j.status;
  lawnJobs=lawnJobs.map(j=>j.id===id?{...j,status:'paid'}:j);
  historyLog.unshift({ id:'h'+Date.now(), type:'paid', message:`Marked ${j.client} job (${fmt(j.date)}) as paid — $${jobAmount(j)}`, ts: new Date().toISOString(), jobId:id, prevStatus:prev });
  if (historyLog.length > 300) historyLog = historyLog.slice(0, 300);
  save(); renderClients(); reopenPanel(j.client); toast('Marked as paid ✓');
}

function undoPaid(hid) {
  const h = historyLog.find(h=>h.id===hid);
  if (!h) return;

  // Single job undo
  if (h.jobId) {
    const job = lawnJobs.find(j=>j.id===h.jobId);
    if (!job) { toast('Job no longer exists'); return; }
    const restore = h.prevStatus || 'unpaid';
    lawnJobs = lawnJobs.map(j=>j.id===h.jobId ? {...j, status:restore} : j);
    historyLog = historyLog.filter(h=>h.id!==hid);
    logHistory('add', `Undid payment — ${job.client} job (${fmt(job.date)}) restored to ${restore}`);
  }

  // Bulk undo
  if (h.bulkJobIds) {
    h.bulkJobIds.forEach(jid => {
      const prev = h.prevStatuses?.[jid] || 'unpaid';
      lawnJobs = lawnJobs.map(j=>j.id===jid ? {...j, status:prev} : j);
    });
    historyLog = historyLog.filter(h=>h.id!==hid);
    logHistory('add', `Undid bulk payment — ${h.bulkJobIds.length} jobs restored`);
  }

  save(); render(); toast('Payment undone ✓');
}

function deleteJob(id) {
  if (!confirm('Delete this job?')) return;
  const j=lawnJobs.find(j=>j.id===id);
  lawnJobs=lawnJobs.filter(j=>j.id!==id);
  logHistory('delete',`Deleted job — ${j.client} on ${fmt(j.date)} ($${jobAmount(j)})`);
  save(); renderClients(); reopenPanel(j.client); toast('Job deleted');
}

function saveJob(id) {

    <td><input id="eo-amount-${id}" type="number" value="${e.amount}" min="0" step="0.01" style="width:90px" /></td>
    <td><select id="eo-type-${id}">
      <option value="gift"${e.type==='gift'?' selected':''}>Gift / birthday</option>
      <option value="income"${e.type==='income'?' selected':''}>Other income</option>
      <option value="expense"${e.type==='expense'?' selected':''}>Expense</option>
    </select></td>
    <td><div class="row-actions">
      <button class="act-btn save" onclick="saveOther('${id}')">save</button>
      <button class="act-btn" onclick="render()">cancel</button>
    </div></td>`;
}

function saveOther(id) {
  const date   = document.getElementById('eo-date-'+id).value;
  const desc   = document.getElementById('eo-desc-'+id).value.trim();
  const amount = parseFloat(document.getElementById('eo-amount-'+id).value);
  const type   = document.getElementById('eo-type-'+id).value;
  if (!date || !desc || isNaN(amount) || amount < 0) { alert('All fields required.'); return; }
  const old = otherMoney.find(e=>e.id===id);
  otherMoney = otherMoney.map(e => e.id===id ? {...e, date, desc, amount, type} : e);
  logHistory('other', `Edited entry — "${old.desc}" → "${desc}" $${amount.toFixed(2)}`);
  save(); render(); toast('Entry updated ✓');
}

function editBalance(key) {
  const label = key === 'bank' ? 'In bank' : 'Cash on hand';
  const cardId = key === 'bank' ? 'bal-bank-card' : 'bal-cash-card';
  const color  = key === 'bank' ? 'var(--purple)' : 'var(--amber)';
  const card   = document.getElementById(cardId);
  const prev   = parseFloat(balances[key]) || 0;
  card.onclick = null;
  card.innerHTML = `
    <div class="metric-label">${label}</div>
    <div style="display:flex;align-items:center;gap:6px;margin-top:4px">
      <span style="font-family:'JetBrains Mono',monospace;font-size:1rem;color:${color}">$</span>
      <input id="bal-input-${key}" type="number" min="0" step="0.01" value="${prev.toFixed(2)}"
        style="font-family:'JetBrains Mono',monospace;font-size:1.1rem;width:100%;padding:3px 6px;color:${color};background:var(--surface3);border:1px solid ${color};border-radius:6px"
        onkeydown="if(event.key==='Enter')saveBalance('${key}');if(event.key==='Escape')render();"
        autofocus />
    </div>
    <div style="display:flex;gap:6px;margin-top:8px">
      <button class="act-btn save" style="font-size:10px;padding:2px 8px" onclick="saveBalance('${key}')">save</button>
      <button class="act-btn" style="font-size:10px;padding:2px 8px" onclick="render()">cancel</button>
    </div>`;
  setTimeout(()=>{ const inp=document.getElementById('bal-input-'+key); if(inp){inp.focus();inp.select();} }, 50);
}

function saveBalance(key) {
  const val = parseFloat(document.getElementById('bal-input-'+key).value);
  if (isNaN(val) || val < 0) { alert('Enter a valid amount.'); return; }
  const label = key === 'bank' ? 'bank' : 'cash';
  logHistory('other', `Updated ${label} balance — $${val.toFixed(2)}`);
  balances[key] = val;
  save(); render(); toast(`${key==='bank'?'Bank':'Cash'} updated ✓`);
}

let toastTimer;
function toast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2200);
}
</script>
</body>
</html>
